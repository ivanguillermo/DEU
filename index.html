<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEU - Panel Minimalista</title>
    <!-- Enlace al Manifest para convertirla en PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Icono de la bandera de Alemania como Emoji en Favicon (o puedes cambiarlo por un SVG/PNG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 900 600%22><rect width=%22900%22 height=%22600%22 fill=%22%23ffce00%22/><rect width=%22900%22 height=%22400%22 fill=%22%23d00%22/><rect width=%22900%22 height=%22200%22 fill=%22%23000%22/></svg>">
    
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            /* Paleta inspirada en la bandera de Alemania: Negro, Rojo, Oro */
            --primary: #dd0000;         /* Rojo alemán elegante */
            --primary-hover: #b30000;
            --accent-gold: #ffcc00;     /* Oro alemán para detalles */
            --border: #eaeaea;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral de Navegación */
        aside {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: relative;
        }

        /* Pequeño detalle superior con los 3 colores alemanes */
        aside::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #000000 33.33%, #dd0000 33.33% 66.66%, #ffcc00 66.66%);
        }

        .logo-area {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 32px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area span {
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: #f5f5f5;
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: var(--text-main);
            color: #ffffff;
        }

        /* Área Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 40px;
        }

        .section-container {
            display: none;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .section-container.active {
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Formularios y Controles de Listas */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Listados Limpios */
        .simple-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background-color: var(--card-bg);
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.01);
            transition: transform 0.1s;
        }

        .list-item span {
            font-size: 1rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            padding: 4px 8px;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            background-color: #fff1f1;
            border-radius: 6px;
        }

        /* Responsividad básica */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow: auto;
            }
            aside {
                width: 100%;
                padding: 16px;
            }
            aside::before {
                display: none;
            }
            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
            }
            main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación Lateral -->
    <aside>
        <div class="logo-area">🇩🇪 <span>DEU</span></div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="switchTab('duolingo', this)">Duolingo</li>
            <li class="nav-item" onclick="switchTab('podcast', this)">Podcast</li>
            <li class="nav-item" onclick="switchTab('kinos', this)">Kinos</li>
            <li class="nav-item" onclick="switchTab('vocabulario', this)">Vocabulario</li>
            <li class="nav-item" onclick="switchTab('bucher', this)">Bucher</li>
        </ul>
    </aside>

    <!-- Contenido de las Secciones -->
    <main>
        <!-- Sección Duolingo -->
        <div id="duolingo" class="section-container active">
            <h1>Duolingo</h1>
            <div class="input-group">
                <input type="text" id="input-duolingo" placeholder="Añadir meta o lección de hoy...">
                <button onclick="addItem('duolingo')">Agregar</button>
            </div>
            <ul id="list-duolingo" class="simple-list"></ul>
        </div>

        <!-- Sección Podcast -->
        <div id="podcast" class="section-container">
            <h1>Podcast</h1>
            <div class="input-group">
                <input type="text" id="input-podcast" placeholder="Nuevo episodio o programa...">
                <button onclick="addItem('podcast')">Agregar</button>
            </div>
            <ul id="list-podcast" class="simple-list"></ul>
        </div>

        <!-- Sección Kinos -->
        <div id="kinos" class="section-container">
            <h1>Kinos</h1>
            <div class="input-group">
                <input type="text" id="input-kinos" placeholder="Película o serie por ver...">
                <button onclick="addItem('kinos')">Agregar</button>
            </div>
            <ul id="list-kinos" class="simple-list"></ul>
        </div>

        <!-- Sección Vocabulario -->
        <div id="vocabulario" class="section-container">
            <h1>Vocabulario</h1>
            <div class="input-group">
                <input type="text" id="input-vocabulario" placeholder="Nueva palabra y significado...">
                <button onclick="addItem('vocabulario')">Agregar</button>
            </div>
            <ul id="list-vocabulario" class="simple-list"></ul>
        </div>

        <!-- Sección Bucher -->
        <div id="bucher" class="section-container">
            <h1>Bucher</h1>
            <div class="input-group">
                <input type="text" id="input-bucher" placeholder="Libro por leer o leer capítulo...">
                <button onclick="addItem('bucher')">Agregar</button>
            </div>
            <ul id="list-bucher" class="simple-list"></ul>
        </div>
    </main>

    <script>
        // Función para cambiar de pestaña
        function switchTab(tabId, element) {
            document.querySelectorAll('.section-container').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // Función sencilla para agregar elementos a la lista correspondiente
        function addItem(category) {
            const input = document.getElementById(`input-${category}`);
            const text = input.value.trim();
            if(!text) return;

            const list = document.getElementById(`list-${category}`);
            
            const li = document.createElement('li');
            li.className = 'list-item';
            li.innerHTML = `
                <span>${text}</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">Eliminar</button>
            `;
            
            list.appendChild(li);
            input.value = '';
        }

        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito', reg))
                    .catch(err => console.log('Error al registrar Service Worker', err));
            });
        }
    </script>
</body>
</html>
